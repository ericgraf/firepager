apiVersion: apps/v1
kind: Deployment
metadata:
  name: firepager-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firepager-frontend
  template:
    metadata:
      labels:
        app: firepager-frontend
    spec:
      containers:
      - name: frontend
        image: firepager-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: firepager-frontend
spec:
  type: NodePort
  selector:
    app: firepager-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
