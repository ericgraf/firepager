server {
    listen 80;

    server_tokens off;

    # Keep this endpoint independent of the SPA so orchestration can check
    # the web server without depending on an application route.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # API responses are user- and session-specific. Never let a proxy or
    # browser cache them, while retaining the existing backend path mapping.
    location ^~ /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://firepager-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Hashed Vite assets can be cached for the lifetime of the image.
    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML is the deployment entry point and must be revalidated after an
    # image rollout so it can reference the current asset filenames.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
