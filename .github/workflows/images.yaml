name: Publish images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.component == 'client'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.component == 'client' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ghcr.io/ericgraf/firepager/${{ matrix.component }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/ericgraf/firepager
